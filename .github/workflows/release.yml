# Publica o instalador Windows quando uma tag v* é enviada.
# Ex.: git tag v2.0.008 && git push origin v2.0.008
# Anexa ControleFinanceiro-Setup.exe e latest.json na Release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  instalador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Versão da tag
        run: node scripts/carimbar-versao.mjs "${GITHUB_REF_NAME#v}"

      - name: Manifest da versão anterior
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download --pattern manifest.json --dir artifacts --clobber || true

      - name: NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Dependências
        run: npm ci

      - name: Compilar app e instalador
        run: npm run build:desktop

      - name: latest.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSAO="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cp -f "artifacts/ControleFinanceiro-Setup-${VERSAO}.exe" artifacts/ControleFinanceiro-Setup.exe
          python3 - <<PY
          import json, pathlib
          p = pathlib.Path("artifacts/latest.json")
          data = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          data["version"] = "${VERSAO}"
          data["url"] = "${BASE}/ControleFinanceiro-Setup.exe"
          data["name"] = "ControleFinanceiro-Setup.exe"
          data.setdefault("notes", "Instalador Windows ${VERSAO}")
          delta = data.get("delta") or None
          if isinstance(delta, dict) and delta.get("url"):
              nome = str(delta["url"]).rstrip("/").split("/")[-1]
              delta["url"] = "${BASE}/" + nome
              data["delta"] = delta
              data["notes"] = "Atualização parcial, aplicada com o app aberto."
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Controle Financeiro ${{ github.ref_name }}
          files: |
            artifacts/ControleFinanceiro-Setup.exe
            artifacts/latest.json
            artifacts/manifest.json
          generate_release_notes: true

      - name: Publicar delta
        if: success()
        run: |
          shopt -s nullglob
          arquivos=(artifacts/ControleFinanceiro-delta-*.zip)
          if [ ${#arquivos[@]} -gt 0 ]; then
            gh release upload "${GITHUB_REF_NAME}" "${arquivos[@]}" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
